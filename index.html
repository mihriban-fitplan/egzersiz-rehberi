<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hipermobilite Egzersiz Rehberi</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #f59e0b;
      --tag-bg: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding-bottom: 40px; }
    
    header { padding: 20px 16px; background: #111827; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #374151; }
    h1 { font-size: 1.15rem; font-weight: 700; margin-bottom: 12px; }
    
    .nav-tabs { display: flex; gap: 8px; }
    .tab-btn {
      flex: 1; padding: 10px 4px; border: none; border-radius: 8px; background: var(--tag-bg);
      color: var(--text-muted); font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .tab-btn.active { background: var(--primary); color: #000; }

    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    .session-info { font-size: 0.8rem; color: var(--accent); margin-bottom: 14px; font-weight: 600; }

    .exercise-card {
      background: var(--card-bg); border-radius: 12px; margin-bottom: 14px;
      overflow: hidden; border: 1px solid #334155; cursor: pointer;
    }
    .card-header {
      padding: 14px; display: flex; justify-content: space-between; align-items: center;
    }
    .exercise-title { font-size: 0.95rem; font-weight: 600; }
    .exercise-meta { font-size: 0.8rem; color: var(--primary); margin-top: 4px; }
    .chevron { font-size: 0.8rem; color: var(--text-muted); transition: transform 0.2s; }
    .exercise-card.open .chevron { transform: rotate(180deg); }

    .card-body {
      display: none; padding: 0 14px 14px 14px; border-top: 1px solid #334155; background: #162032;
    }
    .exercise-card.open .card-body { display: block; }

    .svg-container {
      width: 100%; height: 180px; background: #0f172a; border-radius: 8px;
      margin: 12px 0; display: flex; align-items: center; justify-content: center;
      border: 1px solid #334155;
    }
    .svg-container svg { width: 100%; height: 100%; max-height: 160px; }

    .tip-box {
      background: rgba(245, 158, 11, 0.1); border-left: 3px solid var(--accent);
      padding: 10px; border-radius: 4px; font-size: 0.8rem; line-height: 1.4; color: #fde68a;
    }
    .target-muscles {
      margin-top: 8px; font-size: 0.75rem; color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>Eklemi Koru & Güçlen 🛡️</h1>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchDay(1)">🦵 Alt Vücut</button>
      <button class="tab-btn" onclick="switchDay(2)">💪 Üst Vücut</button>
      <button class="tab-btn" onclick="switchDay(3)">🔥 Tam Vücut</button>
    </div>
  </header>

  <div class="container">
    <div id="session-info" class="session-info">GÜN 1 • 50 dk • Alt Gövde Stabilizasyonu</div>
    <div id="exercise-list"></div>
  </div>

  <script>

    };

    const workoutData = {
      1: {
        info: "GÜN 1 • 50 dk • Alt Gövde & Ayak Tabanı Desteği",
        exercises: [
          {
            name: "Leg Press (Geniş Basış)",
            sets: "3 Set x 10-12 Tekrar",
            muscles: "Hedef: Quadriceps, Gluteus Maximus",
            tip: "Tepe noktasında dizleri ASLA geriye doğru kilitlemeyin (1-2 derece bükülü kalsın). Ağırlığı tarak kemiğine değil, topuklara verin.",
            svg: svgIcons.legPress
          },
          {
            name: "Lying Leg Curl (Arka Bacak)",
            sets: "3 Set x 12 Tekrar",
            muscles: "Hedef: Hamstrings (Diz arkası koruyucuları)",
            tip: "Ağırlığı indirirken bacağı sonuna kadar bırakmayın, kas gerginliğini sürekli koruyarak diz eklem kapsülünü koruyun.",
            svg: svgIcons.legCurl
          },
          {
            name: "Glute Bridge (Yerde Kalça Kaldırma)",
            sets: "3 Set x 12-15 Tekrar",
            muscles: "Hedef: Glutes, Core Stabilizasyonu",
            tip: "Kaldırırken beli aşırı bükmeyin. Tepe noktada kalçayı 2 saniye sıkıp kontrollü inin.",
            svg: svgIcons.gluteBridge
          },
          {
            name: "Calf Raise (Baldır Yükselme)",
            sets: "3 Set x 15 Tekrar",
            muscles: "Hedef: Soleus (Derin kalf) & Aşil Tendonu",
            tip: "Tarak kemiklerini zemine aşırı bastırmadan, baldır kasını sıkarak kontrollü yükselin.",
            svg: svgIcons.calfRaise
          },
          {
            name: "Short Foot / Towel Curl (Ayak Arkı)",
            sets: "3 Set x 10 Tekrar",
            muscles: "Hedef: Ayak İçi Derin Kaslar (Transvers Ark)",
            tip: "Çıplak ayakla, parmakları pençe yapmadan başparmak kökünü topuğa doğru yaklaştırıp ayak kemerini yükseltin.",
            svg: svgIcons.shortFoot
          }
        ]
      },
      2: {
        info: "GÜN 2 • 45-50 dk • Üst Gövde & Postür Zinciri",
        exercises: [
          {
            name: "Seated Cable / Machine Row",
            sets: "3 Set x 10-12 Tekrar",
            muscles: "Hedef: Rhomboids, Latissimus Dorsi, Orta Trapez",
            tip: "Omuz eklemini öne yuvarlamadan kürek kemiklerini arkada birbirine yaklaştırın.",
            svg: svgIcons.row
          },
          {
            name: "Lat Pulldown (Geniş Çekiş)",
            sets: "3 Set x 10-12 Tekrar",
            muscles: "Hedef: Kanat Kasları (Latissimus)",
            tip: "Barı çekerken vücudu aşırı geriye yatırmayın. Omuzları kulaklardan uzak tutarak göğüs üstüne indirin.",
            svg: svgIcons.latPull
          },
          {
            name: "Chest Press Makinesi",
            sets: "3 Set x 10 Tekrar",
            muscles: "Hedef: Pectoralis Major, Ön Omuz",
            tip: "Kolları iterken dirsekleri kilitlemeyin. Tutuş hizası omuzların hafif altında kalmalıdır.",
            svg: svgIcons.chestPress
          },
          {
            name: "Face Pull (Makarada Yüze Çekiş)",
            sets: "3 Set x 15 Tekrar",
            muscles: "Hedef: Arka Omuz, Rotator Cuff Stabilizasyonu",
            tip: "Hipermobil omuzlar için en kritik harekettir. Halatı alnınıza çekerken dirsekleri yukarıda tutun.",
            svg: svgIcons.facePull
          },
          {
            name: "Dead Bug (Kontrollü Karın)",
            sets: "3 Set x 8 Tekrar / Taraf",
            muscles: "Hedef: Transversus Abdominis (Derin Korse)",
            tip: "Bel boşluğunuz zeminle temasını asla kesmemelidir. Hareketi son derece yavaş yapın.",
            svg: svgIcons.deadBug
          }
        ]
      },
      3: {
        info: "GÜN 3 • 50 dk • Tam Vücut & Pelvik Stabilite",
        exercises: [
          {
            name: "Box / Bench Goblet Squat",
            sets: "3 Set x 10 Tekrar",
            muscles: "Hedef: Kalça, Kuadriseps, Pelvis",
            tip: "Arkada bir sehpa olsun; eklemleri aşırı esnetip dibe çökmek yerine kutuya dokunup kontrollü kalkın.",
            svg: svgIcons.gobletSquat
          },
          {
            name: "Single Arm Dumbbell Row",
            sets: "3 Set x 10 Tekrar / Kol",
            muscles: "Hedef: Sırt Asimetri Dengeleme & Çekiş",
            tip: "Gövdeyi döndürmeden, dirseği kalça cebine doğru çekin.",
            svg: svgIcons.dumbbellRow
          },
          {
            name: "Machine Fly (Pec Deck)",
            sets: "3 Set x 12 Tekrar",
            muscles: "Hedef: Göğüs İzolasyonu",
            tip: "Kolları açarken omuz eklemini arkaya doğru aşırı gerdirmeyin. Dirsekler daima hafif kırık kalsın.",
            svg: svgIcons.pecDeck
          },
          {
            name: "Hip Adduction Makinesi",
            sets: "3 Set x 12 Tekrar",
            muscles: "Hedef: İç Bacak & Pelvik Taban",
            tip: "Kapanışta dizleri çarptırmadan, açılışta ise bağların son esneme sınırına gitmeden orta açıklıkta çalışın.",
            svg: svgIcons.hipAdduction
          },
          {
            name: "Tek Bacak Denge Duruşu",
            sets: "3 Set x 30 sn / Bacak",
            muscles: "Hedef: Ayak Bileği Propriosepsiyonu",
            tip: "Sert zeminde durun. Dizinizi kilitlemeyin; ayak tabanının üç noktasına eşit basın.",
            svg: svgIcons.singleBalance
          }
        ]
      }
    };

    function renderExercises(day) {
      const container = document.getElementById('exercise-list');
      const info = document.getElementById('session-info');
      info.textContent = workoutData[day].info;
      container.innerHTML = '';

      workoutData[day].exercises.forEach((ex) => {
        const card = document.createElement('div');
        card.className = 'exercise-card';
        card.innerHTML = `
          <div class="card-header" onclick="toggleCard(this)">
            <div>
              <div class="exercise-title">${ex.name}</div>
              <div class="exercise-meta">${ex.sets}</div>
            </div>
            <span class="chevron">▼</span>
          </div>
          <div class="card-body">
            <div class="svg-container">${ex.svg}</div>
            <div class="tip-box">⚠️ <strong>Stabilite Kuralı:</strong> ${ex.tip}</div>
            <div class="target-muscles">${ex.muscles}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleCard(header) {
      const card = header.parentElement;
      card.classList.toggle('open');
    }

    function switchDay(day) {
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === day);
      });
      renderExercises(day);
    }

    renderExercises(1);
  </script>
</body>
</html>
